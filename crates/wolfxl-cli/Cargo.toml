[package]
name = "wolfxl-cli"
version = "0.11.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Spreadsheet analysis and editing for xlsx/xls/xlsb/ods/csv. Installs `wolfxl` with formula evaluation, styled previews, an interactive grid, column profiles, pivot tables, keyed diffs, content fingerprints, and an MCP server that edits workbooks without losing untouched parts."
readme = "README.md"
keywords = ["xlsx", "excel", "cli", "mcp", "spreadsheet"]
categories = ["command-line-utilities", "visualization"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/wolfxl-cli-v{ version }/wolfxl-cli-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/wolfxl-cli-v{ version }/wolfxl-cli-{ version }-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/wolfxl-cli-v{ version }/wolfxl-cli-{ version }-aarch64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/wolfxl-cli-v{ version }/wolfxl-cli-{ version }-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "wolfxl"
path = "src/main.rs"

[dependencies]
wolfxl-core = { path = "../wolfxl-core", version = "0.9" }
wolfxl-reader = { path = "../wolfxl-reader", version = "0.1" }
wolfxl-formula = { path = "../wolfxl-formula", version = "0.1" }
wolfxl-edit = { path = "../wolfxl-edit", version = "0.1" }
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
base16ct.workspace = true
zip.workspace = true
ratatui = "0.30.2"
unicode-width = "0.2"
tiktoken-rs = "0.11.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
