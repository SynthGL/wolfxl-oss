# Reader-only qualification workspace exported as MIT test-only sources, not a shipped package.
# Compile the candidate Community reader bytes and Community path dependencies.
[workspace]
resolver = "2"

[package]
name = "wolfxl-reader"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "../src/lib.rs"

[dependencies]
codepage = "=0.1.2"
encoding_rs = "=0.8.35"
quick-xml = "=0.42.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate", "unreserved"] }
wolfxl-formula = { path = "../../wolfxl-formula" }
wolfxl-rels = { path = "../../wolfxl-rels" }

[[test]]
name = "native_xls"
path = "../tests/native_xls.rs"

[[test]]
name = "native_ods"
path = "../tests/native_ods.rs"

[[bin]]
name = "community-native-reader-smoke"
path = "smoke.rs"
