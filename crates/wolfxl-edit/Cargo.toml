[package]
name = "wolfxl-edit"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Byte-preserving workbook edits for existing XLSX and XLSM files"
readme = "README.md"
keywords = ["excel", "xlsx", "spreadsheet", "ooxml", "editing"]
categories = ["encoding", "parser-implementations"]

[dependencies]
quick-xml.workspace = true
zip.workspace = true
tempfile.workspace = true
wolfxl-formula = { path = "../wolfxl-formula", version = "0.1" }
wolfxl-rels = { path = "../wolfxl-rels", version = "0.1" }
wolfxl-structural = { path = "../wolfxl-structural", version = "0.1" }

[dev-dependencies]
wolfxl-reader = { path = "../wolfxl-reader", version = "0.1" }
sha2.workspace = true
