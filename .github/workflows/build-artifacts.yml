name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.target }} ${{ matrix.libc.name }} wheels
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        libc:
          - { name: manylinux, compatibility: "2_28", image: "python:3.12-bookworm", minimum_image: "python:3.11-bookworm" }
          - { name: musllinux, compatibility: "musllinux_1_2", image: "python:3.12-alpine", minimum_image: "python:3.11-alpine" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file runtime-requirements.txt
      - name: Enable aarch64 emulation
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.libc.compatibility }}
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      - name: Clean-install minimum-supported CPython 3.11 calculate regression
        shell: bash
        run: |
          platform=linux/amd64
          if [ "${{ matrix.target }}" = "aarch64" ]; then
            platform=linux/arm64
          fi
          docker run --rm --platform "$platform" \
            -v "$PWD:/work:ro" -w /work ${{ matrix.libc.minimum_image }} \
            sh -c 'python -m venv /opt/smoke && /opt/smoke/bin/python -m pip install --require-hashes -r runtime-requirements.txt && /opt/smoke/bin/python .github/scripts/hashed_artifact_requirements.py --output /tmp/wheel-requirements.txt "dist/*cp311-cp311-${{ matrix.libc.name }}*.whl" && /opt/smoke/bin/python -m pip install --require-hashes --no-deps -r /tmp/wheel-requirements.txt && /opt/smoke/bin/python tests/community_wheel_smoke.py'
      - name: Smoke CPython 3.12 wheel
        shell: bash
        run: |
          platform=linux/amd64
          if [ "${{ matrix.target }}" = "aarch64" ]; then
            platform=linux/arm64
          fi
          docker run --rm --platform "$platform" \
            -v "$PWD:/work:ro" -w /work ${{ matrix.libc.image }} \
            sh -c 'python -m pip install --require-hashes -r runtime-requirements.txt && python .github/scripts/hashed_artifact_requirements.py --output /tmp/wheel-requirements.txt "dist/*cp312-cp312-${{ matrix.libc.name }}*.whl" && python -m pip install --require-hashes --no-deps -r /tmp/wheel-requirements.txt && python tests/community_wheel_smoke.py'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc.name }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }} wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file runtime-requirements.txt
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      - name: Clean-install minimum-supported CPython 3.11 calculate regression
        run: |
          python3.11 -m venv "$RUNNER_TEMP/community-py311"
          "$RUNNER_TEMP/community-py311/bin/python" -m pip install --require-hashes -r runtime-requirements.txt
          "$RUNNER_TEMP/community-py311/bin/python" .github/scripts/hashed_artifact_requirements.py --output artifact-requirements.txt "dist/*cp311-cp311-macosx*.whl"
          "$RUNNER_TEMP/community-py311/bin/python" -m pip install --require-hashes --no-deps -r artifact-requirements.txt
          "$RUNNER_TEMP/community-py311/bin/python" tests/community_wheel_smoke.py
      - name: Smoke CPython 3.12 wheel
        run: |
          python3.12 -m pip install --require-hashes -r runtime-requirements.txt
          python3.12 .github/scripts/hashed_artifact_requirements.py --output artifact-requirements.txt "dist/*cp312-cp312-macosx*.whl"
          python3.12 -m pip install --require-hashes --no-deps -r artifact-requirements.txt
          python3.12 tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Windows x86_64 wheels
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15
          architecture: x64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file runtime-requirements.txt
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.14.1
          sccache: true
          target: x86_64-pc-windows-msvc
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      - name: Clean-install minimum-supported CPython 3.11 calculate regression
        shell: pwsh
        run: |
          py -3.11 -m venv "$env:RUNNER_TEMP/community-py311"
          $python = "$env:RUNNER_TEMP/community-py311/Scripts/python.exe"
          $wheel = Get-ChildItem "dist/wolfxl-*-cp311-cp311-win_amd64.whl"
          if ($wheel.Count -ne 1) { throw "expected one CPython 3.11 wheel" }
          & $python -m pip install --require-hashes -r runtime-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python .github/scripts/hashed_artifact_requirements.py --output artifact-requirements.txt $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --require-hashes --no-deps -r artifact-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python tests/community_wheel_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke CPython 3.12 wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "dist/wolfxl-*-cp312-cp312-win_amd64.whl"
          if ($wheel.Count -ne 1) { throw "expected one CPython 3.12 wheel" }
          py -3.12 -m pip install --require-hashes -r runtime-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.12 .github/scripts/hashed_artifact_requirements.py --output artifact-requirements.txt $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.12 -m pip install --require-hashes --no-deps -r artifact-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.12 tests/community_wheel_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
      - name: Export locked runtime and build dependencies
        run: uv export --locked --no-dev --group ci-build --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/build-requirements.txt"
      - name: Build source distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - name: Smoke source distribution
        run: |
          python -m pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          python .github/scripts/hashed_artifact_requirements.py --output artifact-requirements.txt "dist/*.tar.gz"
          python -m pip install --require-hashes --no-deps --no-build-isolation -r artifact-requirements.txt
          python tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel-coverage:
    name: Verify complete supported wheel matrix
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          path: dist
      - name: Require declared interpreters and preserve published platforms
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen

          def wheel_tag(filename):
              return tuple(filename.removesuffix(".whl").rsplit("-", 3)[1:])

          with urlopen("https://pypi.org/pypi/wolfxl/2.0.10/json", timeout=60) as response:
              previous = json.load(response)
          baseline = {
              wheel_tag(entry["filename"])
              for entry in previous["urls"]
              if entry["packagetype"] == "bdist_wheel"
          }
          if not baseline:
              raise SystemExit("published 2.0.10 wheel inventory is empty")
          platforms = {tag[2] for tag in baseline}
          supported = ("cp311", "cp312", "cp313", "cp314")
          dropped = {"cp39", "cp310", "pp39", "pp310"}
          baseline = {tag for tag in baseline if tag[0] not in dropped}
          declared = {
              (tag, tag, platform)
              for tag in supported
              for platform in platforms
          }
          # CPython 3.15 is provisioned explicitly on macOS and Windows and
          # ships in the manylinux x86_64 image; other platforms lack it.
          declared |= {
              ("cp315", "cp315", platform)
              for platform in (
                  "macosx_10_12_x86_64",
                  "macosx_11_0_arm64",
                  "manylinux_2_28_x86_64",
                  "win_amd64",
              )
          }
          actual = {wheel_tag(path.name) for path in Path("dist").rglob("*.whl")}
          missing = sorted((baseline | declared) - actual)
          if missing:
              raise SystemExit(f"missing supported wheel tags: {missing}")
          unsupported = sorted(tag for tag in actual if tag[0] in dropped)
          if unsupported:
              raise SystemExit(f"unsupported wheel tags: {unsupported}")
          print(f"verified {len(actual)} wheel tags; all supported published platforms retained")
          PY
