name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.target }} ${{ matrix.libc.name }} wheels
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        libc:
          - { name: manylinux, compatibility: "2_28", image: "python:3.12-bookworm", python39_image: "python:3.9-bookworm" }
          - { name: musllinux, compatibility: "musllinux_1_2", image: "python:3.12-alpine", python39_image: "python:3.9-alpine" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Enable aarch64 emulation
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.libc.compatibility }}
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      # Discovery compares only major/minor versions, so the patch-level
      # Requires-Python exclusions also hide supported CPython 3.9 releases.
      - name: Build CPython 3.9 wheel explicitly
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.libc.compatibility }}
          args: --release --locked --compatibility pypi --out dist --interpreter ${{ (matrix.target == 'x86_64' && matrix.libc.name == 'manylinux') && '/opt/python/cp39-cp39/bin/python' || 'python3.9' }}
      - name: Clean-install CPython 3.9 calculate regression
        shell: bash
        run: |
          platform=linux/amd64
          if [ "${{ matrix.target }}" = "aarch64" ]; then
            platform=linux/arm64
          fi
          docker run --rm --platform "$platform" \
            -v "$PWD:/work:ro" -w /work ${{ matrix.libc.python39_image }} \
            sh -c 'python -m venv /opt/smoke && /opt/smoke/bin/python -m pip install dist/*cp39-cp39-${{ matrix.libc.name }}*.whl && /opt/smoke/bin/python tests/community_wheel_smoke.py'
      - name: Smoke CPython 3.12 wheel
        shell: bash
        run: |
          platform=linux/amd64
          if [ "${{ matrix.target }}" = "aarch64" ]; then
            platform=linux/arm64
          fi
          docker run --rm --platform "$platform" \
            -v "$PWD:/work:ro" -w /work ${{ matrix.libc.image }} \
            sh -c 'python -m pip install dist/*cp312-cp312-${{ matrix.libc.name }}*.whl && python tests/community_wheel_smoke.py'
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc.name }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }} wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      - name: Build CPython 3.9 wheel explicitly
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --interpreter python3.9
      - name: Clean-install CPython 3.9 calculate regression
        run: |
          python3.9 -m venv "$RUNNER_TEMP/community-py39"
          "$RUNNER_TEMP/community-py39/bin/python" -m pip install dist/*cp39-cp39-macosx*.whl
          "$RUNNER_TEMP/community-py39/bin/python" tests/community_wheel_smoke.py
      - name: Smoke CPython 3.12 wheel
        run: |
          python3.12 -m pip install dist/*cp312-cp312-macosx*.whl
          python3.12 tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Windows x86_64 wheels
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
            3.14
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: x86_64-pc-windows-msvc
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      - name: Build CPython 3.9 wheel explicitly
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: x86_64-pc-windows-msvc
          args: --release --locked --compatibility pypi --out dist --interpreter python3.9
      - name: Clean-install CPython 3.9 calculate regression
        shell: pwsh
        run: |
          py -3.9 -m venv "$env:RUNNER_TEMP/community-py39"
          $python = "$env:RUNNER_TEMP/community-py39/Scripts/python.exe"
          $wheel = Get-ChildItem "dist/wolfxl-*-cp39-cp39-win_amd64.whl"
          if ($wheel.Count -ne 1) { throw "expected one CPython 3.9 wheel" }
          & $python -m pip install $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python tests/community_wheel_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke CPython 3.12 wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "dist/wolfxl-*-cp312-cp312-win_amd64.whl"
          if ($wheel.Count -ne 1) { throw "expected one CPython 3.12 wheel" }
          py -3.12 -m pip install $wheel[0].FullName
          py -3.12 tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build source distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - name: Smoke source distribution
        run: |
          python -m pip install dist/*.tar.gz
          python tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel-coverage:
    name: Verify complete supported wheel matrix
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
      - name: Require declared interpreters and preserve published platforms
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen

          def wheel_tag(filename):
              return tuple(filename.removesuffix(".whl").rsplit("-", 3)[1:])

          with urlopen("https://pypi.org/pypi/wolfxl/2.0.10/json", timeout=60) as response:
              previous = json.load(response)
          baseline = {
              wheel_tag(entry["filename"])
              for entry in previous["urls"]
              if entry["packagetype"] == "bdist_wheel"
          }
          if not baseline:
              raise SystemExit("published 2.0.10 wheel inventory is empty")
          platforms = {tag[2] for tag in baseline}
          declared = {
              (tag, tag, platform)
              for tag in ("cp39", "cp310", "cp311", "cp312", "cp313", "cp314")
              for platform in platforms
          }
          actual = {wheel_tag(path.name) for path in Path("dist").rglob("*.whl")}
          missing = sorted((baseline | declared) - actual)
          if missing:
              raise SystemExit(f"missing supported wheel tags: {missing}")
          print(f"verified {len(actual)} wheel tags; all {len(baseline)} published tags retained")
          PY
