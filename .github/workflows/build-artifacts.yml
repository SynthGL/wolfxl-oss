name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.target }} ${{ matrix.libc.name }} wheels
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        libc:
          - { name: manylinux, compatibility: "2_28", image: "python:3.12-bookworm" }
          - { name: musllinux, compatibility: "musllinux_1_2", image: "python:3.12-alpine" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Enable aarch64 emulation
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.libc.compatibility }}
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      - name: Smoke CPython 3.12 wheel
        shell: bash
        run: |
          platform=linux/amd64
          if [ "${{ matrix.target }}" = "aarch64" ]; then
            platform=linux/arm64
          fi
          docker run --rm --platform "$platform" \
            -v "$PWD:/work:ro" -w /work ${{ matrix.libc.image }} \
            sh -c 'python -m pip install dist/*cp312-cp312-${{ matrix.libc.name }}*.whl && python tests/community_wheel_smoke.py'
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc.name }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }} wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      - name: Smoke CPython 3.12 wheel
        run: |
          python3.12 -m pip install dist/*cp312-cp312-macosx*.whl
          python3.12 tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Windows x86_64 wheels
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
            3.14
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          sccache: true
          target: x86_64-pc-windows-msvc
          args: --release --locked --compatibility pypi --out dist --find-interpreter
      - name: Smoke CPython 3.12 wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "dist/wolfxl-*-cp312-cp312-win_amd64.whl"
          if ($wheel.Count -ne 1) { throw "expected one CPython 3.12 wheel" }
          py -3.12 -m pip install $wheel[0].FullName
          py -3.12 tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build source distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - name: Smoke source distribution
        run: |
          python -m pip install dist/*.tar.gz
          python tests/community_wheel_smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
